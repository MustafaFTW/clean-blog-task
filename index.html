<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Men's Club</title>
  <link href="./style/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light py-3">
    <div class="container">
      <a class="navbar-brand fs-3" href="#">Men's club</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active fs-5" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fs-5" href="#">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fs-5" href="#">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="bg-dark text-white text-center py-5">
    <div class="container">
      <h1 class="display-2">Welcome to Men's club</h1>
      <p class="fs-4">Clothes</p>
    </div>
  </header>

  <section class="py-5">
    <div class="container">
      <div class="row g-4">

        <div class="col-md-6">
          <div class="card w-50 ">
            <img src="images (12).jpeg" class="card-img-top" alt="Coding">
            <div class="card-body">
              <h5 class="card-title fs-4">Jacket</h5>
              <p class="card-text fs-5">A quick intro to the world of coding and its possibilities.</p>
              <a href="#" class="btn btn-primary btn-lg">Buy now</a>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card w-50 ">
            <img src="images (11).jpeg" class="card-img-top" alt="Tech">
            <div class="card-body">
              <h5 class="card-title fs-4">Pump Jacket</h5>
              <p class="card-text fs-5">Exploring new trends in technology and innovation.</p>
              <a href="#" class="btn btn-primary btn-lg">Buy now</a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>


</body>
</html>
